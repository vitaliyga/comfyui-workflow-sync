<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ComfyUI S3 Sync</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background:#111; color:#ddd; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 16px; }
  h2 { font-size:14px; margin:24px 0 8px; color:#9cf; }
  #drop {
    border:2px dashed #555; border-radius:8px; padding:40px; text-align:center;
    color:#888; cursor:pointer; transition:.15s;
  }
  #drop:hover, #drop.hover { border-color:#9cf; color:#9cf; background:#1a2230; }
  #drop small { display:block; color:#666; margin-top:6px; font-size:11px; }
  tr.notfound td.status { color:#fc6; }
  .candidates { margin-top:4px; font-size:11px; color:#bbb; }
  .candidates .head { color:#888; margin-bottom:2px; }
  .candidates a {
    display:block; color:#9cf; cursor:pointer; text-decoration:underline;
    padding:1px 0;
  }
  #files {
    margin-top:12px; padding:8px 12px; background:#1a1a1a; border-radius:4px;
    font: 12px ui-monospace, Menlo, monospace; color:#9cf;
  }
  #files .label { color:#888; margin-right:8px; }
  #files .chip {
    display:inline-block; background:#222; border-radius:3px;
    padding:2px 8px; margin:2px 4px 2px 0;
  }
  table { border-collapse: collapse; width:100%; margin-top:8px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid #222; font-size:13px; vertical-align:top; }
  th { color:#888; font-weight:500; }
  tr.missing td.status { color:#f66; }
  tr.ok td.status { color:#6c6; }
  tr.unknown td.status { color:#fc6; }
  tr.github_only td.status { color:#fc6; }
  #builtin-tail { color:#666; font-size:11px; margin-top:16px; padding:8px 12px; background:#1a1a1a; border-radius:4px; }
  #builtin-tail summary { cursor:pointer; color:#888; }
  #builtin-tail .list { margin-top:6px; font-family: ui-monospace, Menlo, monospace; }
  code { font: 12px ui-monospace, Menlo, monospace; color:#9cf; word-break:break-all; }
  .size { font: 12px ui-monospace, Menlo, monospace; color:#bbb; white-space:nowrap; }
  .size .pending { color:#666; }
  .progress {
    display:block; width:100%; height:4px; background:#222; border-radius:2px;
    margin-top:4px; overflow:hidden;
  }
  .progress > div { height:100%; background:#2a5; width:0; transition: width .3s; }
  button {
    background:#2a5; color:#fff; border:0; border-radius:4px;
    padding:8px 16px; font-size:13px; cursor:pointer; margin-top:12px; margin-right:8px;
  }
  button:disabled { background:#444; cursor:not-allowed; }
  button.secondary { background:#36c; }
  #total { margin-top:12px; color:#9cf; font-size:13px; }
  #console {
    background:#000; color:#9f9; font: 12px ui-monospace, Menlo, monospace;
    padding:12px; margin-top:12px; border-radius:4px;
    max-height:400px; overflow:auto; white-space:pre-wrap; display:none;
  }
  .meta { color:#777; font-size:12px; margin-bottom:16px; }
  #banners { margin-bottom:12px; }
  .banner {
    padding:8px 12px; border-radius:4px; margin-bottom:6px;
    font-size:12px; border:1px solid;
  }
  .banner.error { background:#3a1a1a; border-color:#622; color:#f88; }
  .banner.warn  { background:#3a2a1a; border-color:#763; color:#fc6; }
  .banner.ok    { background:#1a2a1a; border-color:#363; color:#9c6; }
  button.danger { background:#a33; }
  .stalled { color:#fc6; font-size:11px; margin-left:6px; }
  .pick-btn {
    background:none; border:0; color:#9cf; cursor:pointer; font-size:13px;
    padding:0 4px; margin:0;
  }
  .pick-btn:hover { color:#fc6; }
  #picker {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
    z-index:1000; align-items:center; justify-content:center;
  }
  #picker.open { display:flex; }
  #picker .modal {
    background:#1a1a1a; border-radius:6px; width:680px; max-width:92vw;
    max-height:80vh; display:flex; flex-direction:column;
  }
  #picker .head {
    padding:12px 16px; border-bottom:1px solid #333;
    display:flex; gap:8px; align-items:center;
  }
  #picker .crumbs {
    flex:1; font:12px ui-monospace, Menlo, monospace; color:#9cf;
    word-break:break-all;
  }
  #picker .close {
    background:#333; color:#ddd; border:0; padding:4px 10px; border-radius:3px;
    cursor:pointer;
  }
  #picker .search-bar { padding:8px 12px; border-bottom:1px solid #333; }
  #picker .search-input {
    width:100%; box-sizing:border-box; background:#111; color:#ddd;
    border:1px solid #444; border-radius:4px; padding:7px 10px; font-size:13px;
  }
  #picker .search-input:focus { outline:none; border-color:#9cf; }
  #picker .sect { padding:4px 16px; color:#888; font-size:11px; text-transform:uppercase; }
  #picker .item .pth { color:#666; font-size:11px; margin-left:6px; }
  #picker .list { padding:8px 0; overflow-y:auto; flex:1; }
  #picker .item {
    padding:6px 16px; display:flex; gap:10px; align-items:center;
    cursor:pointer; font-size:13px;
  }
  #picker .item:hover { background:#2a2a2a; }
  #picker .item .ico { width:18px; text-align:center; }
  #picker .item .sz { color:#888; font:11px ui-monospace, Menlo, monospace; margin-left:auto; }
  #picker .actions {
    padding:10px 16px; border-top:1px solid #333; display:flex; gap:8px;
    align-items:center; flex-wrap:wrap;
  }
  #picker .actions .hint { color:#888; font-size:11px; margin-right:auto; }
  #picker .pick-here {
    background:#2a5; color:#fff; border:0; padding:6px 12px; border-radius:3px;
    cursor:pointer;
  }
  #picker .pick-here:disabled { background:#444; cursor:not-allowed; }
  #add-row-btn { background:#36c; }
  tr.overridden td.status { color:#9cf; }
</style>
</head>
<body>
<h1>ComfyUI S3 Sync</h1>
<div class="meta" id="meta">…</div>
<div id="banners"></div>
<div id="drop">
  Drop workflow .json files here, or click to choose
  <small>multiple files supported — deps will be merged</small>
</div>
<input type="file" id="file-input" accept=".json,application/json" multiple style="display:none" />

<div id="files" style="display:none"></div>

<div id="results" style="display:none">
  <h2>Models</h2>
  <table id="models-table">
    <thead><tr><th style="width:24px"></th><th>File</th><th>Folder</th><th>Status</th><th>Size</th><th>S3 source</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Custom Nodes</h2>
  <table id="nodes-table">
    <thead><tr><th style="width:24px"></th><th>Node type</th><th>Package</th><th>Status</th><th>Size</th><th>S3 source</th></tr></thead>
    <tbody></tbody>
  </table>

  <details id="builtin-tail" style="display:none">
    <summary></summary>
    <div class="list"></div>
  </details>

  <div id="total"></div>
  <button id="select-all-btn" class="secondary">Select All</button>
  <button id="clear-all-btn" class="secondary">Clear All</button>
  <button id="sync-btn">Sync Selected</button>
  <button id="stop-btn" class="danger" style="display:none">Stop</button>
  <button id="reanalyze-btn" class="secondary" style="display:none">Re-analyze</button>
  <button id="add-row-btn" class="secondary">+ Add path</button>
</div>

<div id="picker">
  <div class="modal">
    <div class="head">
      <span class="crumbs"></span>
      <button class="close">✕</button>
    </div>
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="🔎 search by name (clear to browse folders)" />
    </div>
    <div class="list"></div>
    <div class="actions">
      <span class="hint"></span>
      <button class="pick-here" disabled>Use this folder</button>
    </div>
  </div>
</div>

<pre id="console"></pre>

<script>
let lastAnalysis = null;
let lastWorkflows = [];
// extra rows the user added manually via "+ Add path"
const customRows = [];   // [{kind:'model'|'node', s3_source, local_dest, bytes}]
// s3_source -> { bytes, files, candidates }
const sizeCache = {};
// s3_source -> overridden s3_source (when user picks a candidate)
const overrides = {};
// item rows by item_index during sync
let syncRows = [];
// s3_source URLs that completed successfully in this session — used to
// promote 🔵 Custom / 🔵 Picked rows to ✅ OK once they're really on disk.
const syncedSources = new Set();

const drop = document.getElementById('drop');
const meta = document.getElementById('meta');
const results = document.getElementById('results');
const modelsBody = document.querySelector('#models-table tbody');
const nodesBody = document.querySelector('#nodes-table tbody');
const totalEl = document.getElementById('total');
const syncBtn = document.getElementById('sync-btn');
const reBtn = document.getElementById('reanalyze-btn');
const cons = document.getElementById('console');

let currentJobId = null;
const stopBtn = document.getElementById('stop-btn');
const banners = document.getElementById('banners');

function setBanners(items) {
  banners.innerHTML = items.map(b =>
    `<div class="banner ${b.kind}">${b.text}</div>`).join('');
}

function refreshStatus() {
  return fetch('/status').then(r=>r.json()).then(s=>{
    const free = s.disk_free != null ? humanBytes(s.disk_free) : 'n/a';
    const idx = s.index || {};
    const ts = idx.indexed_at ? new Date(idx.indexed_at * 1000).toLocaleString() : '—';
    meta.innerHTML = `ComfyUI: ${escHtml(s.comfyui_path)} · free disk: ${free} · parallel: ${s.parallel} · `
      + `<span title="indexed at ${ts}">S3: ${idx.model_files||0} models / ${idx.node_classes||0} classes — CM registry: ${idx.cm_classes||0} classes</span> · `
      + `<a href="#" id="reindex-link" style="color:#9cf">⟳ reindex</a>`;
    document.getElementById('reindex-link').addEventListener('click', async e => {
      e.preventDefault();
      meta.innerHTML += ' <span style="color:#fc6">indexing…</span>';
      await fetch('/reindex', { method:'POST' });
      refreshStatus();
    });
    const issues = [];
    const pf = s.preflight || {};
    if (pf.comfyui && !pf.comfyui.ok) {
      issues.push({ kind:'error', text:`ComfyUI path issue: ${pf.comfyui.error}` });
    }
    if (pf.auth && !pf.auth.ok) {
      issues.push({ kind:'error', text:`AWS auth failed: ${escHtml(pf.auth.error || '')}` });
    }
    if (pf.models_bucket && !pf.models_bucket.ok) {
      issues.push({ kind:'warn', text:`S3 models bucket unreachable: ${escHtml(pf.models_bucket.error || '')}` });
    }
    if (pf.nodes_bucket && !pf.nodes_bucket.ok) {
      issues.push({ kind:'warn', text:`S3 nodes bucket unreachable: ${escHtml(pf.nodes_bucket.error || '')}` });
    }
    setBanners(issues);
    return s;
  });
}
refreshStatus();

const fileInput = document.getElementById('file-input');

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));

drop.addEventListener('click', () => fileInput.click());

drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.name.endsWith('.json'));
  if (!files.length) return;
  const workflows = [];
  const names = [];
  for (const f of files) {
    try { workflows.push(JSON.parse(await f.text())); names.push(f.name); }
    catch { alert(`not valid JSON: ${f.name}`); return; }
  }
  fileInput.value = '';
  showFiles(names);
  await analyzeAll(workflows);
}

function showFiles(names) {
  const el = document.getElementById('files');
  el.style.display = '';
  el.innerHTML = `<span class="label">Loaded (${names.length}):</span>` +
    names.map(n => `<span class="chip">${escHtml(n)}</span>`).join('');
}

async function analyzeAll(workflows) {
  lastWorkflows = workflows;
  // Serialise — the backend ensure_index_fresh() coalesces concurrent
  // calls now, but sequential keeps the work order predictable and
  // avoids 10 parallel analyzes on a cold index.
  const analyses = [];
  for (const wf of workflows) {
    const r = await fetch('/analyze', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ workflow: wf })
    });
    analyses.push(await r.json());
  }
  lastAnalysis = mergeAnalyses(analyses);
  render();
  await fetchSizes();
}

function mergeAnalyses(list) {
  const models = new Map();
  const nodes = new Map();
  const assumed = new Set();
  for (const a of list) {
    for (const m of (a.models || [])) {
      models.set(`${m.folder}|${m.file}`, m);
    }
    for (const n of (a.custom_nodes || [])) {
      const k = n.package_hint || `__unknown__${n.node_type}`;
      if (!nodes.has(k)) nodes.set(k, n);
    }
    for (const b of (a.assumed_builtin || [])) assumed.add(b);
  }
  return {
    models: [...models.values()],
    custom_nodes: [...nodes.values()],
    assumed_builtin: [...assumed].sort(),
  };
}

function humanBytes(n) {
  if (n == null) return '—';
  if (n === 0) return '0 B';
  const u = ['B','KiB','MiB','GiB','TiB'];
  const i = Math.min(u.length-1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i ? 2 : 0) + ' ' + u[i];
}

function checkboxCell(syncable) {
  return syncable
    ? '<td><input type="checkbox" class="pick" checked></td>'
    : '<td></td>';
}

function render() {
  modelsBody.innerHTML = '';
  lastAnalysis.models.forEach((m, idx) => {
    const tr = document.createElement('tr');
    const needsPicker = !m.s3_source;  // model not in S3 index
    const wasSynced = m.s3_source && syncedSources.has(m.s3_source);
    const showOk = m.exists_locally || wasSynced;
    if (showOk) tr.className = 'ok';
    else if (needsPicker) tr.className = 'unknown';
    else if (m.status === 'overridden') tr.className = 'overridden';
    else tr.className = 'missing';
    tr.dataset.src = m.s3_source || '__noresolve_m_' + idx;
    let status;
    if (showOk) status = '✅ OK';
    else if (needsPicker) status = '❌ Not on S3';
    else if (m.status === 'overridden') status = '🔵 Picked';
    else status = '🔴 Missing';
    const syncable = !showOk && !!m.s3_source;
    const pickBtn = needsPicker
      ? `<button class="pick-btn" title="Browse S3" data-row-kind="model" data-row-idx="${idx}">📁</button>`
      : '';
    tr.innerHTML = `
      ${checkboxCell(syncable)}
      <td>${escHtml(m.file)}</td>
      <td>${escHtml(m.folder)}</td>
      <td class="status">${status} ${pickBtn}</td>
      <td class="size">${m.exists_locally ? '—' : '<span class="pending">…</span>'}</td>
      <td><code>${m.exists_locally ? '—' : escHtml(m.s3_source || '')}</code></td>`;
    modelsBody.appendChild(tr);
  });
  // user-added custom model rows
  customRows.filter(r => r.kind === 'model').forEach(r => {
    const tr = document.createElement('tr');
    const done = syncedSources.has(r.s3_source);
    tr.className = done ? 'ok' : 'missing';
    tr.dataset.src = r.s3_source;
    tr.innerHTML = `
      ${checkboxCell(!done)}
      <td>${escHtml(r.file)}</td>
      <td>${escHtml(r.folder)}</td>
      <td class="status">${done ? '✅ OK' : '🔵 Custom'}</td>
      <td class="size">${humanBytes(r.bytes)}</td>
      <td><code>${escHtml(r.s3_source)}</code></td>`;
    modelsBody.appendChild(tr);
  });
  nodesBody.innerHTML = '';
  lastAnalysis.custom_nodes.forEach((n, idx) => {
    const tr = document.createElement('tr');
    const wasSynced = n.s3_source && syncedSources.has(n.s3_source);
    tr.className = wasSynced ? 'ok' : n.status;
    tr.dataset.src = n.s3_source || '__noresolve_n_' + idx;
    let status = '❓ Unknown';
    if (wasSynced || n.status === 'ok') status = '✅ OK';
    else if (n.status === 'missing') status = '🔴 Missing';
    else if (n.status === 'github_only') status = '🟡 Not in S3';
    else if (n.status === 'overridden') status = '🔵 Picked';
    const syncable = !wasSynced && (n.status === 'missing' || n.status === 'overridden') && !!n.s3_source;
    const sizeCell = syncable ? '<span class="pending">…</span>' : '—';
    let note;
    if (n.status === 'github_only') {
      note = `<a href="${escHtml(n.github_url)}" target="_blank" style="color:#fc6">${escHtml(n.github_url)}</a>`;
    } else if (n.exists_locally) {
      note = '<code>—</code>';
    } else {
      note = `<code>${escHtml(n.s3_source || '')}</code>`;
    }
    const needsPicker = n.status === 'github_only';
    const pickBtn = needsPicker
      ? `<button class="pick-btn" title="Browse S3" data-row-kind="node" data-row-idx="${idx}">📁</button>`
      : '';
    tr.innerHTML = `
      ${checkboxCell(syncable)}
      <td>${escHtml(n.node_type)}</td>
      <td>${escHtml(n.package_hint || '—')}</td>
      <td class="status">${status} ${pickBtn}</td>
      <td class="size">${sizeCell}</td>
      <td>${note}</td>`;
    nodesBody.appendChild(tr);
  });
  // user-added custom node rows
  customRows.filter(r => r.kind === 'node').forEach(r => {
    const tr = document.createElement('tr');
    const done = syncedSources.has(r.s3_source);
    tr.className = done ? 'ok' : 'missing';
    tr.dataset.src = r.s3_source;
    tr.innerHTML = `
      ${checkboxCell(!done)}
      <td>—</td>
      <td>${escHtml(r.pkg)}</td>
      <td class="status">${done ? '✅ OK' : '🔵 Custom'}</td>
      <td class="size"><span class="pending">…</span></td>
      <td><code>${escHtml(r.s3_source)}</code></td>`;
    nodesBody.appendChild(tr);
  });
  // wire pick buttons
  document.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const kind = btn.dataset.rowKind;
      const idx = Number(btn.dataset.rowIdx);
      const mode = kind === 'model' ? 'file' : 'folder';
      openPicker(mode, null, picked => applyOverride(kind, idx, picked));
    });
  });
  bindPicks();
  // assumed-builtin tail
  const tail = document.getElementById('builtin-tail');
  const list = lastAnalysis.assumed_builtin || [];
  if (list.length) {
    tail.style.display = '';
    tail.querySelector('summary').textContent =
      `${list.length} node type${list.length===1?'':'s'} not in S3 / not in CM registry — assumed built-in`;
    tail.querySelector('.list').textContent = list.join(', ');
  } else {
    tail.style.display = 'none';
  }

  results.style.display = '';
  reBtn.style.display = 'none';
  syncBtn.disabled = false;
  cons.style.display = 'none';
  cons.textContent = '';
  totalEl.textContent = '';
}

async function fetchSizes() {
  const sources = [];
  for (const m of lastAnalysis.models) {
    if (!m.exists_locally && m.s3_source && !sizeCache[m.s3_source]) sources.push(m.s3_source);
  }
  for (const n of lastAnalysis.custom_nodes) {
    if (['missing','overridden'].includes(n.status) && n.s3_source && !sizeCache[n.s3_source]) {
      sources.push(n.s3_source);
    }
  }
  for (const r of customRows) {
    if (!sizeCache[r.s3_source]) sources.push(r.s3_source);
  }
  if (sources.length) {
    const r = await fetch('/size', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ sources })
    });
    const { sizes } = await r.json();
    Object.assign(sizeCache, sizes);
  }
  // populate every row's size cell from cache (covers both freshly-fetched
  // entries AND rows that were re-rendered but already had a cached size).
  for (const [src, info] of Object.entries(sizeCache)) {
    const row = document.querySelector(`tr[data-src="${cssEscape(src)}"]`);
    if (!row) continue;
    const cell = row.querySelector('.size');
    const statusCell = row.querySelector('.status');
    cell.innerHTML = '';
    if (info.bytes != null) {
      cell.textContent = humanBytes(info.bytes) + (info.files > 1 ? ` (${info.files} files)` : '');
    } else if (info.candidates && info.candidates.length) {
      row.classList.remove('missing');
      row.classList.add('notfound');
      statusCell.textContent = '❌ Not on S3';
      cell.innerHTML = '<span class="pending">n/a</span>';
      const div = document.createElement('div');
      div.className = 'candidates';
      div.innerHTML = '<div class="head">similar in S3:</div>' + info.candidates.map(c =>
        `<a data-src="${escHtml(src)}" data-pick="${escHtml(c.s3_source)}" data-bytes="${c.bytes}">${escHtml(c.name)} — ${humanBytes(c.bytes)}</a>`
      ).join('');
      cell.appendChild(div);
    } else {
      row.classList.remove('missing');
      row.classList.add('notfound');
      statusCell.textContent = '❌ Not on S3';
      cell.innerHTML = '<span class="pending">n/a</span>';
      // can't sync — disable checkbox
      const cb = row.querySelector('input.pick');
      if (cb) { cb.checked = false; cb.disabled = true; }
    }
  }
  recomputeTotal();

  document.querySelectorAll('.candidates a').forEach(a => {
    a.addEventListener('click', () => {
      const orig = a.dataset.src;
      const pick = a.dataset.pick;
      const bytes = Number(a.dataset.bytes);
      overrides[orig] = pick;
      sizeCache[orig] = { bytes, files: 1, candidates: [] };
      const row = document.querySelector(`tr[data-src="${cssEscape(orig)}"]`);
      row.classList.remove('notfound');
      row.classList.add('missing');
      row.querySelector('.status').textContent = '🔴 Missing (substituted)';
      const cell = row.querySelector('.size');
      cell.innerHTML = humanBytes(bytes) + ` <small style="color:#666">→ ${escHtml(pick.split('/').pop())}</small>`;
      const cb = row.querySelector('input.pick');
      if (cb) { cb.disabled = false; cb.checked = true; }
      recomputeTotal();
    });
  });
}

function recomputeTotal() {
  let total = 0, count = 0;
  document.querySelectorAll('input.pick').forEach(cb => {
    if (!cb.checked) return;
    const row = cb.closest('tr');
    const src = row.dataset.src;
    const sz = sizeCache[src];
    if (sz && sz.bytes) { total += sz.bytes; count++; }
  });
  totalEl.textContent = count
    ? `Selected: ${count} item${count===1?'':'s'} · ${humanBytes(total)}`
    : 'Nothing selected.';
}

function cssEscape(s) { return CSS.escape(s); }

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function isPicked(s3_source) {
  const row = document.querySelector(`tr[data-src="${cssEscape(s3_source)}"]`);
  const cb = row && row.querySelector('input.pick');
  return !!(cb && cb.checked);
}

function buildSyncItems() {
  const items = [];
  for (const m of lastAnalysis.models) {
    if (m.exists_locally || !m.s3_source) continue;
    if (!isPicked(m.s3_source)) continue;
    const sz = sizeCache[m.s3_source];
    if (!sz || sz.bytes == null) continue;
    const src = overrides[m.s3_source] || m.s3_source;
    items.push({
      s3_source: src, local_dest: m.local_path, is_file: true,
      expected_bytes: sz.bytes,
    });
  }
  for (const n of lastAnalysis.custom_nodes) {
    if (!['missing','overridden'].includes(n.status) || !n.s3_source) continue;
    if (!isPicked(n.s3_source)) continue;
    const sz = sizeCache[n.s3_source];
    if (!sz || sz.bytes == null) continue;
    items.push({
      s3_source: n.s3_source, local_dest: n.local_path, is_file: false,
      expected_bytes: sz.bytes,
    });
  }
  for (const r of customRows) {
    if (!isPicked(r.s3_source)) continue;
    const sz = sizeCache[r.s3_source];
    items.push({
      s3_source: r.s3_source,
      local_dest: r.local_dest,
      is_file: r.kind === 'model',
      expected_bytes: sz ? sz.bytes : r.bytes,
    });
  }
  return items;
}

function bindPicks() {
  document.querySelectorAll('input.pick').forEach(cb => {
    cb.addEventListener('change', recomputeTotal);
  });
}

document.getElementById('select-all-btn').addEventListener('click', () => {
  document.querySelectorAll('input.pick').forEach(cb => { cb.checked = true; });
  recomputeTotal();
});
document.getElementById('clear-all-btn').addEventListener('click', () => {
  document.querySelectorAll('input.pick').forEach(cb => { cb.checked = false; });
  recomputeTotal();
});

function attachProgress(row, expected) {
  let bar = row.querySelector('.progress');
  if (!bar) {
    bar = document.createElement('span');
    bar.className = 'progress';
    bar.innerHTML = '<div></div>';
    row.querySelector('.size').appendChild(bar);
  }
  return { bar, fill: bar.querySelector('div'), expected };
}

stopBtn.addEventListener('click', async () => {
  if (!currentJobId) return;
  stopBtn.disabled = true;
  await fetch(`/sync/${currentJobId}`, { method:'DELETE' });
});

syncBtn.addEventListener('click', async () => {
  const items = buildSyncItems();
  if (!items.length) { alert('nothing to sync'); return; }
  syncBtn.disabled = true;
  stopBtn.disabled = false;
  stopBtn.style.display = '';
  reBtn.style.display = 'none';
  cons.style.display = '';
  cons.textContent = '';
  syncRows = items.map(it => {
    const row = document.querySelector(`tr[data-src="${cssEscape(it.s3_source)}"]`);
    const handle = row ? attachProgress(row, it.expected_bytes) : {};
    handle.src = it.s3_source;
    return handle;
  });

  const r = await fetch('/sync', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ items })
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    alert(`sync failed: ${err.detail || r.statusText}`);
    syncBtn.disabled = false;
    stopBtn.style.display = 'none';
    return;
  }
  const { job_id } = await r.json();
  currentJobId = job_id;
  const es = new EventSource(`/sync/${job_id}/stream`);
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.event === 'start') {
      cons.textContent += `\n$ ${msg.cmd}\n`;
    } else if (msg.event === 'log') {
      cons.textContent += msg.line + '\n';
    } else if (msg.event === 'progress') {
      const r = syncRows[msg.item_index];
      if (r && r.expected) {
        const pct = Math.min(100, msg.bytes_downloaded / r.expected * 100);
        r.fill.style.width = pct.toFixed(1) + '%';
      }
    } else if (msg.event === 'stalled') {
      const r = syncRows[msg.item_index];
      if (r) {
        let tag = r.bar.parentElement.querySelector('.stalled');
        if (msg.stalled) {
          if (!tag) {
            tag = document.createElement('span');
            tag.className = 'stalled';
            tag.textContent = '⚠ stalled';
            r.bar.parentElement.appendChild(tag);
          }
        } else if (tag) tag.remove();
      }
    } else if (msg.event === 'exit') {
      const r = syncRows[msg.item_index];
      if (r) {
        if (r.fill) r.fill.style.width = msg.exit_code === 0 ? '100%' : r.fill.style.width;
        if (msg.exit_code === 0 && r.src) syncedSources.add(r.src);
      }
      cons.textContent += `[exit ${msg.exit_code}]\n`;
    } else if (msg.event === 'error') {
      cons.textContent += `[error] ${msg.message}\n`;
    } else if (msg.event === 'done') {
      cons.textContent += `\n--- done (exit ${msg.exit_code}) ---\n`;
      es.close();
      currentJobId = null;
      stopBtn.style.display = 'none';
      if (msg.exit_code === 0 && lastWorkflows.length) {
        cons.textContent += `re-analyzing…\n`;
        analyzeAll(lastWorkflows);
      } else {
        reBtn.style.display = '';
      }
    }
    cons.scrollTop = cons.scrollHeight;
  };
});

reBtn.addEventListener('click', () => analyzeAll(lastWorkflows));

// ---- S3 picker modal ----
const picker = document.getElementById('picker');
const pickerCrumbs = picker.querySelector('.crumbs');
const pickerList = picker.querySelector('.list');
const pickerHere = picker.querySelector('.pick-here');
const pickerHint = picker.querySelector('.hint');
const pickerSearch = picker.querySelector('.search-input');
let pickerState = { mode: null, prefix: null, onPick: null };
let searchTimer = null;

picker.querySelector('.close').addEventListener('click', closePicker);
picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });

pickerSearch.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = pickerSearch.value.trim();
  if (!q) { loadPickerDir(pickerState.prefix || ''); return; }
  searchTimer = setTimeout(() => runPickerSearch(q), 250);
});

function closePicker() {
  picker.classList.remove('open');
  pickerState = { mode: null, prefix: null, onPick: null };
}

async function openPicker(mode, startPrefix, onPick) {
  // mode: 'file' (only files selectable) | 'folder' (only folders) | 'any'
  pickerState = { mode, prefix: startPrefix || '', onPick };
  pickerHint.textContent = mode === 'file'
    ? 'click a file to select'
    : mode === 'folder'
    ? 'navigate into a folder and click "Use this folder"'
    : 'pick a file or use the current folder';
  pickerHere.style.display = mode === 'file' ? 'none' : '';
  pickerSearch.value = '';
  picker.classList.add('open');
  await loadPickerDir(startPrefix || '');
}

async function runPickerSearch(q) {
  pickerCrumbs.textContent = `search: ${q}`;
  pickerHere.disabled = true;
  pickerList.innerHTML = '<div class="item">searching…</div>';
  let d;
  try {
    const r = await fetch(`/search?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) {
    pickerList.innerHTML = `<div class="item" style="color:#f66">search error: ${e.message}</div>`;
    return;
  }
  const files = pickerState.mode === 'folder' ? [] : (d.files || []);
  const nodes = pickerState.mode === 'file' ? [] : (d.nodes || []);
  pickerList.innerHTML = '';
  if (!files.length && !nodes.length) {
    pickerList.innerHTML = '<div class="item" style="color:#888">no matches</div>';
    return;
  }
  if (files.length) {
    const h = document.createElement('div');
    h.className = 'sect'; h.textContent = 'Files';
    pickerList.appendChild(h);
  }
  for (const f of files) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="ico">📄</span><span>${escHtml(f.name)}`
      + `<span class="pth">${escHtml(f.folder || '')}</span></span>`
      + `<span class="sz">${humanBytes(f.bytes)}</span>`;
    row.onclick = () => {
      pickerState.onPick({ kind: 'file', s3: f.s3, bytes: f.bytes });
      closePicker();
    };
    pickerList.appendChild(row);
  }
  if (nodes.length) {
    const h = document.createElement('div');
    h.className = 'sect'; h.textContent = 'Custom nodes';
    pickerList.appendChild(h);
  }
  for (const n of nodes) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="ico">📦</span><span>${escHtml(n.name)}/</span>`;
    row.onclick = () => {
      pickerState.onPick({ kind: 'folder', s3: n.s3 });
      closePicker();
    };
    pickerList.appendChild(row);
  }
}

async function loadPickerDir(prefix) {
  pickerList.innerHTML = '<div class="item">loading…</div>';
  const u = prefix ? `/browse?prefix=${encodeURIComponent(prefix)}` : '/browse';
  const r = await fetch(u);
  if (!r.ok) {
    pickerList.innerHTML = `<div class="item" style="color:#f66">error: ${r.status}</div>`;
    return;
  }
  const d = await r.json();
  pickerState.prefix = d.prefix;
  pickerCrumbs.textContent = d.prefix;
  pickerHere.disabled = pickerState.mode === 'file';
  pickerHere.onclick = () => {
    pickerState.onPick({ kind: 'folder', s3: d.prefix });
    closePicker();
  };
  pickerList.innerHTML = '';
  if (d.parent) {
    const up = document.createElement('div');
    up.className = 'item';
    up.innerHTML = '<span class="ico">⤴</span><span>..</span>';
    up.onclick = () => loadPickerDir(d.parent);
    pickerList.appendChild(up);
  }
  for (const f of d.folders) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="ico">📁</span><span>${escHtml(f)}/</span>`;
    row.onclick = () => loadPickerDir(d.prefix + f + '/');
    pickerList.appendChild(row);
  }
  if (pickerState.mode !== 'folder') {
    for (const f of d.files) {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<span class="ico">📄</span><span>${escHtml(f.name)}</span>`
        + `<span class="sz">${humanBytes(f.size)}</span>`;
      row.onclick = () => {
        pickerState.onPick({ kind: 'file', s3: d.prefix + f.name, bytes: f.size });
        closePicker();
      };
      pickerList.appendChild(row);
    }
  }
}

// ---- override existing row's s3_source via picker ----
function applyOverride(rowKind, originalIdx, picked) {
  const list = rowKind === 'model' ? lastAnalysis.models : lastAnalysis.custom_nodes;
  const row = list[originalIdx];
  row.s3_source = picked.s3;
  if (picked.bytes != null) {
    sizeCache[picked.s3] = { bytes: picked.bytes, files: 1, candidates: [] };
  }
  // for models, derive local_path from picked file
  if (rowKind === 'model' && picked.kind === 'file') {
    const parts = picked.s3.split('/');
    const filename = parts[parts.length - 1];
    // best-effort: drop into models/<folder>/<file> where <folder> is the last
    // path segment before the file
    const folder = parts[parts.length - 2] || 'misc';
    row.folder = folder;
    row.file = filename;
    row.local_path = lastStatus.comfyui_path + '/models/' + folder + '/' + filename;
    row.exists_locally = false;
  }
  if (rowKind === 'node' && picked.kind === 'folder') {
    const parts = picked.s3.replace(/\/$/,'').split('/');
    const pkg = parts[parts.length - 1];
    row.package_hint = pkg;
    row.local_path = lastStatus.comfyui_path + '/custom_nodes/' + pkg;
    row.exists_locally = false;
    row.status = 'overridden';
  }
  if (rowKind === 'model') row.s3_exists = true;
  render();
  fetchSizes();
}

// stash last status for path building
let lastStatus = { comfyui_path: '/workspace/ComfyUI' };
fetch('/status').then(r=>r.json()).then(s => { lastStatus = s; });

// ---- "+ Add path" button ----
document.getElementById('add-row-btn').addEventListener('click', () => {
  openPicker('any', null, picked => {
    if (picked.kind === 'file') {
      const parts = picked.s3.split('/');
      const filename = parts[parts.length - 1];
      const folder = parts[parts.length - 2] || 'misc';
      customRows.push({
        kind: 'model',
        s3_source: picked.s3,
        local_dest: `${lastStatus.comfyui_path}/models/${folder}/${filename}`,
        bytes: picked.bytes,
        file: filename, folder,
      });
    } else {
      const parts = picked.s3.replace(/\/$/,'').split('/');
      const pkg = parts[parts.length - 1];
      customRows.push({
        kind: 'node',
        s3_source: picked.s3,
        local_dest: `${lastStatus.comfyui_path}/custom_nodes/${pkg}`,
        bytes: null,
        pkg,
      });
    }
    if (!lastAnalysis) lastAnalysis = { models: [], custom_nodes: [], assumed_builtin: [] };
    render();
    fetchSizes();
  });
});

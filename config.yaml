# All node→package and filename→folder mapping is auto-discovered from S3
# via index_models() / index_nodes() in main.py. Re-built on first /analyze
# and refreshed every INDEX_TTL seconds (default 24h) or via POST /reindex.
#
# The keys below are now OPTIONAL — fill them only if the index misses
# something specific:
#   model_node_map — folder hint for basename collisions (rare).
#   node_packages  — substring→package override for nodes whose
#                    NODE_CLASS_MAPPINGS the parser can't follow.

model_extensions:
  - .safetensors
  - .gguf
  - .pt
  - .bin
  - .ckpt
  - .pth

# Optional disambiguation hints: when multiple models in S3 share a basename,
# this tells us which folder a given loader node refers to. Format:
#   <node_class>: [<widget_index_legacy>, <folder>]
model_node_map: {}

# Optional package overrides for nodes not auto-discoverable from
# NODE_CLASS_MAPPINGS in __init__.py / nodes.py. Substring match against
# class_type. Format: <substring>: <package_dir_under_custom_nodes/>
node_packages: {}


# Path to local ComfyUI install: set COMFYUI_PATH in .env.
# (You can still override here as a fallback.)

# node_type -> [widget_index, folder under models/]
model_node_map:
  CheckpointLoaderSimple: [0, checkpoints]
  UNETLoader:             [0, unet]
  CLIPLoader:             [0, clip]
  DualCLIPLoader:         [0, clip]
  TripleCLIPLoader:       [0, clip]
  VAELoader:              [0, vae]
  "Load Lora":            [0, loras]
  LoraLoader:             [0, loras]
  LoraLoaderModelOnly:    [0, loras]
  SeedVR2LoadDiTModel:    [0, unet]
  SeedVR2LoadVAEModel:    [0, vae]
  ControlNetLoader:       [0, controlnet]
  UpscaleModelLoader:     [0, upscale_models]

model_extensions:
  - .safetensors
  - .gguf
  - .pt
  - .bin
  - .ckpt
  - .pth

# Just the list of folders that exist under models/.
# Full S3 URL is built as: ${S3_MODELS_BASE}/<folder>/<file>
model_folders:
  - checkpoints
  - loras
  - vae
  - clip
  - unet
  - controlnet
  - upscale_models

# substring(node_type) -> package directory name under custom_nodes/
# Full S3 URL is built as: ${S3_NODES_BASE}/<package>/
node_packages:
  rgthree:                 rgthree-comfy
  LayerUtility:            ComfyUI-LayerStyle
  SeedVR2:                 SeedVR2
  DepthAnythingV2:         comfyui-depth-anything-v2
  OpenposePreprocessor:    comfyui_controlnet_aux
  "RIFE VFI":              ComfyUI-Frame-Interpolation
  PainterI2V:              ComfyUI-PainterI2V
  easy:                    ComfyUI-Easy-Use
  "CR ":                   ComfyUI_Comfyroll_CustomNodes
  ImageConcatMulti:        ComfyUI-tbox
  ImageConcanate:          ComfyUI-tbox
  GrowMaskWithBlur:        ComfyUI-KJNodes
  GetNode:                 ComfyUI-KJNodes
  SetNode:                 ComfyUI-KJNodes
  "Mask Fill Holes":       ComfyUI_essentials
  MaskPreview+:            ComfyUI_essentials
  ImageScaleToTotalPixels: ComfyUI_essentials
  ImageScaleToMaxDimension: ComfyUI_essentials
  PromptLoopNode:          ComfyUI-Custom-Scripts

builtin_nodes:
  - KSampler
  - KSamplerSelect
  - KSamplerAdvanced
  - SamplerCustomAdvanced
  - CLIPTextEncode
  - CLIPTextEncodeSDXL
  - VAEDecode
  - VAEEncode
  - VAEEncodeForInpaint
  - LoadImage
  - LoadImageMask
  - SaveImage
  - PreviewImage
  - SaveVideo
  - CreateVideo
  - EmptyLatentImage
  - EmptySD3LatentImage
  - EmptyFlux2LatentImage
  - LatentUpscaleBy
  - LatentUpscale
  - ImageScaleBy
  - ImageScale
  - ImagePadForOutpaint
  - GetImageSize
  - RandomNoise
  - CFGGuider
  - BasicGuider
  - BasicScheduler
  - ModelSamplingFlux
  - ModelSamplingSD3
  - ModelSamplingAuraFlow
  - Flux2Scheduler
  - Note
  - MarkdownNote
  - InpaintModelConditioning
  - CheckpointLoaderSimple
  - UNETLoader
  - CLIPLoader
  - DualCLIPLoader
  - TripleCLIPLoader
  - VAELoader
  - LoraLoader
  - LoraLoaderModelOnly
  - "Load Lora"
  - ControlNetLoader
  - ControlNetApply
  - ControlNetApplyAdvanced
  - UpscaleModelLoader

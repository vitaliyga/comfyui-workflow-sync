# config.yaml is now OPTIONAL. The whole node→package and filename→folder
# mapping is auto-built from:
#   1. Your S3 bucket (indexed once, refreshed via POST /reindex or every
#      INDEX_TTL seconds).
#   2. ComfyUI Manager registry (extension-node-map.json from GitHub).
#
# Anything not in either source is assumed to be a stock ComfyUI node and
# silently skipped. The assumed-builtin list is returned in /analyze for
# transparency.
#
# This file exists only for the rare overrides below. Delete it if not used.

# Override list of model extensions (defaults baked in if absent).
# model_extensions: [.safetensors, .gguf, .pt, .bin, .ckpt, .pth]

# Folder hint when two models in S3 share a basename:
#   <node_class>: [_, <preferred_folder>]
model_node_map: {}

# Substring override for packages whose NODE_CLASS_MAPPINGS the parser
# can't auto-detect AND that aren't in ComfyUI-Manager registry:
#   <substring>: <package_dir>
node_packages: {}
